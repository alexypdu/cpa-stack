services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:v7.2.158
    container_name: cli-proxy-api
    restart: unless-stopped
    ports:
      - '127.0.0.1:8317:8317'
      - '127.0.0.1:1455:1455'
    volumes:
      - ./cpa/auths:/CLIProxyAPI/.cli-proxy-api
      - ./cpa/config.yaml:/CLIProxyAPI/config.yaml
      - ./cpa/logs:/CLIProxyAPI/logs
      - ./cpa/plugins:/CLIProxyAPI/plugins
    networks:
      - cpa-network

  cpa-usage-keeper:
    image: ghcr.io/willxup/cpa-usage-keeper:v1.15.4
    container_name: cpa-usage-keeper
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    ports:
      - '127.0.0.1:8318:8080'
    environment:
      TZ: America/New_York
      CPA_BASE_URL: http://cli-proxy-api:8317
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:?CPA_MANAGEMENT_KEY must be set}
      REDIS_QUEUE_ADDR: cli-proxy-api:8317
      AUTH_ENABLED: 'true'
      LOGIN_PASSWORD: ${CPA_KEEPER_LOGIN_PASSWORD:?CPA_KEEPER_LOGIN_PASSWORD must be set}
    volumes:
      - ./keeper:/data
    networks:
      - cpa-network

networks:
  cpa-network:
    driver: bridge
